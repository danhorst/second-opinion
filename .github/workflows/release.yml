name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.2.0) — tag must already exist on the default branch"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          # Pin to the tag on both trigger paths — a workflow_dispatch checkout
          # of branch HEAD may predate the release commit, yielding empty notes.
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Require release tag on main
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: scripts/check-release publish "$RELEASE_TAG"

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Verify build and tests
        run: |
          make test
          go build ./...

      - name: Parse version
        id: version
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          BARE="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "bare=$BARE" >> "$GITHUB_OUTPUT"

      - name: Extract changelog entry
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.bare }}"
          NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            echo "Error: no changelog entry found for $VERSION — refusing to create a release with empty notes"
            exit 1
          fi
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compute source tarball SHA256
        id: sha
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          URL="https://github.com/danhorst/second-opinion/archive/refs/tags/${TAG}.tar.gz"
          curl --fail --location --retry 3 "$URL" -o /tmp/second-opinion-source.tar.gz
          SHA=$(sha256sum /tmp/second-opinion-source.tar.gz | cut -d' ' -f1)
          echo "source=$SHA" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ steps.changelog.outputs.notes }}
        run: |
          printf '%s' "$RELEASE_NOTES" > /tmp/release-notes.md
          gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1 && exit 0
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file /tmp/release-notes.md

      - name: Update tap formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          BARE: ${{ steps.version.outputs.bare }}
          SOURCE_SHA: ${{ steps.sha.outputs.source }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/danhorst/homebrew-tap.git" tap

          scripts/render-homebrew-formula "$TAG" "$SOURCE_SHA" > tap/Formula/second-opinion.rb

          git -C tap config user.name "github-actions[bot]"
          git -C tap config user.email "github-actions[bot]@users.noreply.github.com"
          git -C tap add Formula/second-opinion.rb
          git -C tap diff --cached --quiet && echo "Tap already up to date, skipping." && exit 0
          git -C tap commit -m "Update second-opinion to ${TAG}"
          git -C tap push
