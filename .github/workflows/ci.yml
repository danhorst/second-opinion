name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - run: make test
      - run: go test -race ./...
      - run: go build ./...
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal skills)"
