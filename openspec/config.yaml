schema: spec-driven

context: |
  ## Purpose

  second-opinion sends a document or a diff to a model that did not write it, and returns adversarial findings.
  The premise is model-level: a model cannot reliably review its own work, so the reviewer must be a
  different model than the author. A different model of the same family qualifies — Claude reviewing
  Claude-written work with a different Claude model is a valid second opinion.

  The tool is unbiased: it has no home model. It is callable from any common harness (the CLI, or MCP
  from Claude Code, Codex, Antigravity, or anything else that speaks MCP) to any common provider —
  Anthropic included.

  A CLI and a local MCP gateway are two thin front-ends over one review engine.
  This supersedes `dotfiles/claude/bin/second-opinion.sh`.

  ## Design guarantees

  - The reviewer runs cold with respect to implicit context: everything it sees is explicitly
    assembled into the material — no auto-loaded project instruction files, ambient provider
    configuration, or session history. An author may deliberately include supporting files; a
    provider that slurps context on its own violates the guarantee. Strict prevention of
    deliberate filesystem reads is a separate capability. The material is auditable: it is
    always possible to see exactly what the reviewer received. This is a property of the
    provider layer, not of any one adapter; every adapter proves it against a shared conformance suite.
  - Providers are interchangeable. `codex`, `claude`, and `antigravity` shell out;
    `openai-compatible` and `ollama` speak HTTP. Transport must not leak into the interface.
  - The reviewer finds; it does not rank. Severity is the reviewer's guess and ours to distrust.
    Novelty is the axis it cannot judge, because it cannot see what the author already knew.

  ## Critical behavior

  - A target is either a list of file paths, concatenated, or `git diff <base>` where base defaults to HEAD.
  - Provider selection and model selection are separate concerns. Forcing a model is a foot-gun:
    Codex silently rejects some models under ChatGPT-account auth. The tool detects that one failure
    and falls back to the provider default.
  - Failure is loud. Exit status distinguishes "the reviewer ran and found nothing" from
    "the reviewer did not run."

  ## Tech stack

  Go, single module — `cmd/` front-ends over an `internal/` engine.
  MCP via `github.com/modelcontextprotocol/go-sdk` (1.x, stable).
  `make test`, `gofmt`. Shipped through `homebrew-tap`, github-tarball flavor.

  ## Project conventions

  - Cover behavior boundaries. Do not mock the provider boundary to reach a coverage number —
    a mock of `codex` asserts what we believe `codex` does, which is the thing actually in doubt.
  - Adapters are exercised against the real binary or endpoint behind a build tag.
  - Anything genuinely untestable is named in AGENTS.md rather than faked.

  ## Open questions

  - Where triage lives. The reviewer emits many findings; clustering, deduping, and ranking by
    severity x novelty currently happen in the calling agent's harness. Under MCP the caller is
    frequently the same model that wrote the material, so "the caller triages" means the author
    grades its own homework — the exact failure this tool exists to prevent.
  - Whether the tool enforces its own premise. Nothing currently prevents a review by the same
    model that wrote the material. Should the engine accept an author declaration and refuse or
    warn on a same-model review? Enforcement compares model identities, never vendors — a
    different model of the same family is a valid reviewer. At minimum, findings must carry
    reviewer provenance (provider, model, prompt version) so a violation is detectable after
    the fact.
  - What shape findings take at the engine boundary — raw reviewer text or a structured
    envelope. The MCP front-end and the triage question both hang on this. Whatever the
    shape, provenance must survive it.

  ## External dependencies

  - `codex` (OpenAI) — subprocess. Auth is ChatGPT-account or API key, and the two expose different model sets.
  - `claude` (Anthropic) — subprocess, `claude -p --output-format json --tools "" --setting-sources ""`;
    no stdin with a prompt argument; truthful model provenance via the JSON envelope's modelUsage.
  - `antigravity` (Google) — subprocess, `agy --print`; itself a multi-model harness (Gemini, Claude,
    GPT-OSS), no stdin in print mode, no structured output naming the model that ran.
  - `ollama` — local HTTP endpoint.
  - `openai-compatible` — configurable remote HTTP endpoint using the common chat-completions subset; OpenRouter is one supported configuration.
  - Google deprecated the Gemini CLI in favor of the Antigravity toolchain (2026-07); `antigravity`
    is Google's representation in the roster.
  - Provider locality is a selection axis: material sent to `codex`, `claude`, `antigravity`,
    or `openai-compatible` leaves the machine; `ollama` exists partly so material that must stay
    local can still get a second opinion.

rules:
  proposal:
    - Include a "Non-goals" section.
  design:
    - State how the change preserves the cold-reviewer guarantee, or argue why it cannot.
